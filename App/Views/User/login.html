{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block body %}
<style>
@media (min-width: 1366px) {
    .auth-layout .login-wraper {
        min-height: 700px !important;
    }
    .auth-layout .login-wraper .hidden-xs,
    .auth-layout .login-wraper .hidden-xs img {
        height: 100% !important;
    }
    .auth-layout .login-wraper .hidden-xs img {
        width: 100% !important;
        object-fit: cover !important;
    }
    .auth-layout .login-wraper .login-window {
        position: absolute !important;
        width: 570px !important;
        top: 50% !important;
        left: 50% !important;
        margin: 0 0 0 24px !important;
        -webkit-transform: translateY(-50%) !important;
        -ms-transform: translateY(-50%) !important;
        transform: translateY(-50%) !important;
        max-height: none !important;
        overflow: visible !important;
    }
    .auth-layout .login-wraper .banner-text {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        margin: 0 0 0 -24px !important;
        -webkit-transform: translate(-100%, -50%) !important;
        -ms-transform: translate(-100%, -50%) !important;
        transform: translate(-100%, -50%) !important;
        width: 550px !important;
        max-width: calc(50vw - 80px) !important;
    }
}
</style>
<div class="container-fluid bg-image auth-layout">
    <div class="row">
        <div class="login-wraper">
            <div class="banner-text hidden-xs">
                <div class="line"></div>
                <div class="b-text">
                    <h1 class="color-b1">Des <span class="color-active">centaines<br> </span> <span class="color-b1">d'articles vous
                                    </span>attendent</h1>
                </div>
            </div>
            <div class="login-window">
                <div class="l-head">
                    Connexion
                </div>
                <div class="l-form">
                    <form action="" method="post">
                        {% if formError %}
                            <div class="alert alert-danger" role="alert">
                                {{ formError }}
                            </div>
                        {% endif %}
                        <div class="form-group">
                            <label for="exampleInputEmail1">Email</label>
                            <input type="email" class="form-control" id="exampleInputEmail1" name="email"
                                   placeholder="sample@gmail.com">
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1">Password</label>
                            <input type="password" class="form-control" id="exampleInputPassword1"
                                   name="password" placeholder="**********">
                        </div>
                        <div class="checkbox">
                            <div style="position: relative; padding-left: 40px;">
                                <label
                                        class="checkbox"
                                        for="remember_me"
                                        style="position: absolute; left: 0; top: 0; margin-left: 0;"
                                        aria-label="Se souvenir de moi"
                                >
                                    <span class="sr-only">Se souvenir de moi</span>
                                    <input type="checkbox" id="remember_me" name="remember_me" value="1">
                                    <span class="arrow"></span>
                                </label>

                                <label for="remember_me">Se souvenir de moi</label>
                                <span class="text2">(non recommandé si vous êtes sur un ordinateur partagé)</span>
                            </div>
                        </div>
                        <div class="row">
                            <div
                                    class="col-lg-7"><button type="submit" name="submit" class="btn btn-cv1">Connexion
                                </button></div>
                            <div class="hidden-xs">
                                <div class="col-lg-1 ortext">or</div>
                                <div class="col-lg-4 signuptext"><a href="/register">Inscription</a></div>
                            </div>
                        </div>
                        <div class="row hidden-xs">
                            <div class="col-lg-12 forgottext">
                                <a href="#">Mot de passe oublié ?</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
